<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema LEEPER{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Estilos do Layout -->
    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #333333;
            font-weight: 500;
            margin-bottom: 0.25rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
        }
        .sidebar .nav-link:hover {
            background-color: #f1f3f5;
        }
        .sidebar .nav-link.active {
            background-color: #e9ecef;
            color: #0d6efd;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Barra Lateral (Sidebar) -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
                <div class="d-flex align-items-center mb-4">
                    <h5 class="text-primary fw-bold m-0">
                        <i class="bi bi-box-seam me-2"></i>LEEPER
                    </h5>
                </div>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">
                            <i class="bi bi-house-door me-2"></i>Início
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-box me-2"></i>Materiais
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-arrow-down-up me-2"></i>Movimentações
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'listar_usuarios' %}">
                            <i class="bi bi-people me-2"></i>Usuários
                        </a>
                    </li>
                </ul>

                <hr class="my-4">

                <div>
                    <a href="#" class="nav-link text-danger">
                        <i class="bi bi-box-arrow-right me-2"></i>Sair
                    </a>
                </div>
            </nav>

            <!-- Conteúdo Principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                
                <!-- Exibição de Mensagens do Django (Notificações) -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- Bloco de Conteúdo Dinâmico das Páginas -->
                {% block content %}
                {% endblock %}

            </main>
        </div>
    </div>

    <!-- JavaScript do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}
        
    {% endblock %}
</body>
</html>
