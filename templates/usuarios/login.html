<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LEEPER</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>

    <div class="card shadow-sm login-card">
        <div class="text-center mb-4">
            <h3 class="text-primary fw-bold">
                <i class="bi bi-box-seam me-2"></i>LEEPER
            </h3>
            <p class="text-muted mb-0">Sistema de Controle de Inventário</p>
        </div>

        <!-- Mensagem de erro caso o login falhe -->
        {% if form.errors %}
            <div class="alert alert-danger alert-dismissible fade show py-2" role="alert">
                <small>Usuário ou senha incorretos.</small>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold">Usuário / E-mail</label>
                <input type="text" name="username" class="form-control" id="id_username" placeholder="Digite seu usuário" required autofocus>
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label fw-semibold">Senha</label>
                <input type="password" name="password" class="form-control" id="id_password" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
            </button>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
